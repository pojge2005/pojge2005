<g stroke="#35ddff" stroke-width="3" opacity=".55"><path d="M0 343H1200M0 378H1200M60 300V420M130 300V420M200 300V420M270 300V420M340 300V420M410 300V420M480 300V420M550 300V420M620 300V420M690 300V420M760 300V420M830 300V420M900 300V420M970 300V420M1040 300V420M1110 300V420"/></g>
