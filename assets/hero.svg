<g font-family="monospace" font-size="12">
 <g transform="translate(790 40)"><rect width="170" height="104" rx="10" fill="#081528" fill-opacity=".84" stroke="#38dfff" stroke-opacity=".8"/><circle cx="14" cy="14" r="3" fill="#ff719f"/><circle cx="25" cy="14" r="3" fill="#ffc56b"/><circle cx="36" cy="14" r="3" fill="#45edb0"/><path d="M14 35H91M14 48H145M14 61H119M14 74H78M14 87H132" stroke="#4fe4ff" stroke-width="3" stroke-linecap="round" opacity=".8"><animate attributeName="opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/></path></g>
 <g transform="translate(1010 184)"><rect width="144" height="74" rx="10" fill="#170d2c" fill-opacity=".9" stroke="#c779ff"/><text x="14" y="28" fill="#ffb6e3" font-size="13">BUILD / TEST</text><text x="14" y="49" fill="#70edff">ITERATE →</text><path d="M14 60H122" stroke="#9a64ff" stroke-width="2"/></g>
</g>
