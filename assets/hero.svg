<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Prasanna — Build beyond the ordinary</title>
<desc id="desc">Original anime-inspired young engineer in a futuristic workshop with a glowing robot, sunset city and holographic code panels.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060b19"/><stop offset=".55" stop-color="#17153b"/><stop offset="1" stop-color="#43165e"/></linearGradient>
 <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe0a6"/><stop offset=".55" stop-color="#ff8f9c"/><stop offset="1" stop-color="#9c59ff"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe0c1"/><stop offset="1" stop-color="#c9857c"/></linearGradient>
 <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182b55"/><stop offset="1" stop-color="#080d1b"/></linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f8ff"/><stop offset="1" stop-color="#7589ae"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#29ddff" stop-opacity=".5"/><stop offset="1" stop-color="#29ddff" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#000" flood-opacity=".65"/></filter>
</defs>
<rect width="1200" height="420" rx="22" fill="url(#bg)"/>
<circle cx="1020" cy="115" r="106" fill="url(#sun)"><animate attributeName="opacity" values=".78;1;.78" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="1020" cy="115" r="155" fill="#ff72c6" opacity=".2" filter="url(#blur)"/>
