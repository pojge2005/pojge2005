 <rect x="-40" y="26" width="80" height="49" rx="16" fill="#071326" stroke="#45e6ff" stroke-width="3"/>
 <ellipse cx="-18" cy="49" rx="9" ry="12" fill="#20e7ff"><animate attributeName="ry" values="12;2;12" dur="4.2s" repeatCount="indefinite" keyTimes="0;.06;.13"/></ellipse>
 <ellipse cx="18" cy="49" rx="9" ry="12" fill="#20e7ff"><animate attributeName="ry" values="12;2;12" dur="4.2s" repeatCount="indefinite" keyTimes="0;.06;.13"/></ellipse>
 <path d="M-10 64Q0 72 10 64" fill="none" stroke="#9b86ff" stroke-width="3" stroke-linecap="round"/>
 <rect x="-32" y="-2" width="64" height="21" rx="10" fill="#d6e0f5" stroke="#f4f7ff" stroke-width="3"/><circle cy="8" r="7" fill="#39e7ff"/>
 <path d="M-50 43-65 58M50 43 65 58" stroke="#b6c7e6" stroke-width="10" stroke-linecap="round"/><circle cx="-65" cy="60" r="7" fill="#38e8ff"/><circle cx="65" cy="60" r="7" fill="#38e8ff"/>
