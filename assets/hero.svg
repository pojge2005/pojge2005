<!-- copy -->
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <text x="52" y="68" fill="#71e7ff" font-size="17" font-weight="700" letter-spacing="4">ENGINEER • BUILDER • DREAMER</text>
 <text x="48" y="137" fill="#fff" font-size="57" font-weight="800">PRASANNA</text>
 <text x="52" y="178" fill="#c9caff" font-size="25" font-weight="600">Poigey</text>
 <rect x="52" y="197" width="316" height="2" fill="#936bff"/>
 <text x="53" y="231" fill="#e9edff" font-size="18">Embedded • AI • IoT • Robotics</text>
 <text x="53" y="258" fill="#e9edff" font-size="18">Software built for the real world.</text>
 <g font-size="12" font-weight="700">
  <rect x="52" y="281" width="88" height="31" rx="15" fill="#2d1e60" stroke="#a17aff"/><text x="96" y="301" text-anchor="middle" fill="#eee8ff">BUILD</text>
  <rect x="148" y="281" width="94" height="31" rx="15" fill="#10374a" stroke="#40e6ff"/><text x="195" y="301" text-anchor="middle" fill="#d5fbff">CREATE</text>
  <rect x="250" y="281" width="94" height="31" rx="15" fill="#4a1c42" stroke="#ff91cd"/><text x="297" y="301" text-anchor="middle" fill="#ffe5f4">INNOVATE</text>
 </g>
 <text x="53" y="346" fill="#81eaff" font-size="15" font-style="italic">“Turning ideas into real-world solutions.”</text>
 <text x="852" y="35" fill="#fff" font-size="12" letter-spacing="3">FUTURE IN PROGRESS</text>
</g>
